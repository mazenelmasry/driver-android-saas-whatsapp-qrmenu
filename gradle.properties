# Project-wide Gradle settings.

# JVM args — give Gradle 4GB and Kotlin daemon 2GB.
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false
# Daemons idle out after 30 min instead of the 3-hour default. Stale daemons from
# earlier sessions used to pile up (7+ java processes, ~7GB) alongside Studio +
# emulator + browser until the Kotlin compile daemon could no longer start —
# surfacing as "Could not connect to Kotlin compile daemon" / spurious
# "Compilation error" on rebuild. See CLAUDE.md §11.
org.gradle.daemon.idletimeout=1800000

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# -Duser.language/-Duser.country are LOAD-BEARING, not cosmetic. The Kotlin compile
# daemon names its run-file with a locale-formatted timestamp; on an Arabic-locale
# Windows it emits Arabic-Indic digits (kotlin-daemon.٢٠٢٦-٠٧-٢٢T…run), which the
# Gradle-side client's ASCII-digit parser can't match — so every build fails with
# "Could not connect to Kotlin compile daemon" and falls back to in-process
# compilation, which then OOMs as a spurious "Internal compiler error".
# The Gradle daemon already gets these flags automatically; the Kotlin daemon does not.
# Same Arabic-Indic-digit class of bug as CLAUDE.md §16.6, one layer down.
kotlin.daemon.jvmargs=-Xmx2g -Duser.language=en -Duser.country=US

# KSP — KSP2 still has incompatibilities with Room as of Dec 2025; pin to KSP1.
ksp.incremental=true
ksp.useKSP2=false
